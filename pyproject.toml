[project]
name = "shorts-radar"
version = "0.1.0"
description = "Find the YouTube Shorts that beat their own channel in any niche, then let an AI agent turn them into Short proposals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kevin Blanco" }]
dependencies = ["serpapi>=1.1", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shorts-radar = "shorts_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
